<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Real Glyph Motion Verification</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #f7f0e6;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }

      pre {
        position: fixed;
        left: 8px;
        bottom: 8px;
        max-width: calc(100vw - 16px);
        max-height: 45vh;
        overflow: auto;
        margin: 0;
        padding: 8px;
        color: #2f2a25;
        background: rgba(255, 255, 255, 0.86);
        border: 1px solid rgba(87, 70, 52, 0.16);
        font: 11px/1.35 Consolas, monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <iframe id="appFrame" src="./index.html"></iframe>
    <pre id="report">Preparing...</pre>
    <script>
      "use strict";

      const wait = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));

      async function setupApp() {
        const frame = document.getElementById("appFrame");
        await new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
        await wait(80);

        const win = frame.contentWindow;
        const doc = frame.contentDocument;
        const editor = doc.getElementById("editor");
        const effectEnabled = doc.getElementById("effectEnabled");
        const reduceMotion = doc.getElementById("reduceMotion");
        const glyphMotion = doc.getElementById("glyphMotionRange");
        const particleAmount = doc.getElementById("particleAmountRange");
        const select = doc.getElementById("effectModeSelect");
        const isolationStyle = doc.createElement("style");

        isolationStyle.textContent = ".fx-canvas,.typing-mark{display:none!important;visibility:hidden!important;}";
        doc.head.append(isolationStyle);
        new win.MutationObserver((mutations) => {
          mutations.forEach((mutation) => {
            mutation.addedNodes.forEach((node) => {
              if (node.nodeType !== Node.ELEMENT_NODE) return;
              if (node.matches(".typing-mark")) node.style.display = "none";
              node.querySelectorAll?.(".typing-mark").forEach((mark) => {
                mark.style.display = "none";
              });
            });
          });
        }).observe(doc.body, { childList: true, subtree: true });

        if (effectEnabled && !effectEnabled.checked) {
          effectEnabled.checked = true;
          effectEnabled.dispatchEvent(new Event("change", { bubbles: true }));
        }
        if (reduceMotion && reduceMotion.checked) {
          reduceMotion.checked = false;
          reduceMotion.dispatchEvent(new Event("change", { bubbles: true }));
        }
        if (glyphMotion) {
          glyphMotion.value = "100";
          glyphMotion.dispatchEvent(new Event("input", { bubbles: true }));
        }
        if (particleAmount) {
          particleAmount.value = "0";
          particleAmount.dispatchEvent(new Event("input", { bubbles: true }));
        }

        editor.innerHTML = "";
        editor.focus();
        return { win, doc, editor, select };
      }

      function placeCaretAtEnd(win, doc, editor) {
        const range = doc.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
        const selection = win.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      }

      async function runCase(app, label, mode, glyph, composition) {
        const { win, doc, editor, select } = app;
        select.value = mode;
        select.dispatchEvent(new Event("change", { bubbles: true }));
        editor.innerHTML = "";
        placeCaretAtEnd(win, doc, editor);

        if (composition) {
          editor.dispatchEvent(new CompositionEvent("compositionstart", { data: "", bubbles: true }));
          doc.execCommand("insertText", false, glyph);
          editor.dispatchEvent(new CompositionEvent("compositionend", { data: glyph, bubbles: true }));
        } else {
          doc.execCommand("insertText", false, glyph);
          editor.dispatchEvent(new InputEvent("input", { inputType: "insertText", data: glyph, bubbles: true }));
        }

        await wait(60);
        doc.querySelectorAll(".typing-mark").forEach((mark) => {
          mark.style.display = "none";
        });

        const realGlyph = doc.querySelector(".typing-real-glyph");
        const animations = realGlyph ? realGlyph.getAnimations() : [];
        animations.forEach((animation) => animation.pause());

        const style = realGlyph ? win.getComputedStyle(realGlyph) : null;
        const transform = style ? style.transform : "";
        const moved = Boolean(realGlyph && transform && transform !== "none" && !/^matrix\(1,\s*0,\s*0,\s*1,\s*0,\s*0\)$/.test(transform));
        const serialized = typeof win.serializeEditorContent === "function" ? win.serializeEditorContent() : editor.innerHTML;
        const mark = doc.querySelector(".typing-mark");
        const canvas = doc.querySelector(".fx-canvas");
        const markStyle = mark ? win.getComputedStyle(mark) : null;
        const canvasStyle = canvas ? win.getComputedStyle(canvas) : null;
        const markDisplay = markStyle ? markStyle.display : "";
        const markVisibility = markStyle ? markStyle.visibility : "";
        const canvasDisplay = canvasStyle ? canvasStyle.display : "";
        const canvasVisibility = canvasStyle ? canvasStyle.visibility : "";

        animations.forEach((animation) => animation.play());
        await wait(620);

        return {
          label,
          mode,
          glyph,
          moved,
          transform,
          activeRealGlyph: Boolean(realGlyph),
          textDuringMotion: editor.textContent,
          serializedClean: !serialized.includes("typing-real-glyph"),
          wrappersAfterCleanup: doc.querySelectorAll(".typing-real-glyph").length,
          textAfterCleanup: editor.textContent,
          canvasDisplay,
          canvasVisibility,
          markDisplay,
          markVisibility,
          canvasHidden: canvasStyle ? canvasDisplay === "none" || canvasVisibility === "hidden" : false,
          oldGlyphLayerHidden: markStyle ? markDisplay === "none" || markVisibility === "hidden" : true
        };
      }

      async function runFastInputCase(app, label, mode, text, composition) {
        const { win, doc, editor, select } = app;
        select.value = mode;
        select.dispatchEvent(new Event("change", { bubbles: true }));
        editor.innerHTML = "";
        placeCaretAtEnd(win, doc, editor);
        const baselineRect = editor.getBoundingClientRect();
        let maxLeftDelta = 0;
        let maxWidthDelta = 0;
        const trackEditorBox = () => {
          const rect = editor.getBoundingClientRect();
          maxLeftDelta = Math.max(maxLeftDelta, Math.abs(rect.left - baselineRect.left));
          maxWidthDelta = Math.max(maxWidthDelta, Math.abs(rect.width - baselineRect.width));
        };

        for (const glyph of Array.from(text)) {
          if (composition) {
            editor.dispatchEvent(new CompositionEvent("compositionstart", { data: "", bubbles: true }));
            doc.execCommand("insertText", false, glyph);
            editor.dispatchEvent(new CompositionEvent("compositionend", { data: glyph, bubbles: true }));
          } else {
            editor.dispatchEvent(new KeyboardEvent("keydown", { key: glyph, bubbles: true }));
            doc.execCommand("insertText", false, glyph);
            editor.dispatchEvent(new InputEvent("input", { inputType: "insertText", data: glyph, bubbles: true }));
          }
          trackEditorBox();
          await wait(8);
          trackEditorBox();
        }

        await wait(380);
        trackEditorBox();
        if (typeof win.flushCommittedGlyphAnimations === "function") {
          win.flushCommittedGlyphAnimations({ preserveSelection: true });
        }
        await wait(40);
        trackEditorBox();

        const selection = win.getSelection();
        const serialized = typeof win.serializeEditorContent === "function" ? win.serializeEditorContent() : editor.innerHTML;
        return {
          label,
          mode,
          text,
          resultText: editor.textContent,
          textOk: editor.textContent === text,
          caretCollapsed: Boolean(selection && selection.rangeCount && selection.isCollapsed),
          serializedClean: !serialized.includes("typing-real-glyph"),
          wrappersAfterCleanup: doc.querySelectorAll(".typing-real-glyph").length,
          editorLeftDelta: Number(maxLeftDelta.toFixed(3)),
          editorWidthDelta: Number(maxWidthDelta.toFixed(3))
        };
      }

      async function runVerification() {
        const app = await setupApp();
        const cases = [
          await runCase(app, "English", "candy-pop", "A", false),
          await runCase(app, "Korean", "electric", "\ud55c", true)
        ];
        const fastCases = [
          await runFastInputCase(app, "Fast English", "electric", "thequickbrownfoxiiiiijumps", false),
          await runFastInputCase(app, "Fast Korean", "candy-pop", "\ud55c\uae00\ud14c\uc2a4\ud2b8", true)
        ];
        const singleGlyphPassed = cases.every((item) =>
          item.moved &&
          item.serializedClean &&
          item.wrappersAfterCleanup === 0 &&
          item.textAfterCleanup === item.glyph &&
          item.canvasHidden &&
          item.oldGlyphLayerHidden
        );
        const fastInputPassed = fastCases.every((item) =>
          item.textOk &&
          item.caretCollapsed &&
          item.serializedClean &&
          item.wrappersAfterCleanup === 0 &&
          item.editorLeftDelta <= 0.5 &&
          item.editorWidthDelta <= 0.5
        );
        const passed = singleGlyphPassed && fastInputPassed;
        document.getElementById("report").textContent = JSON.stringify({ passed, cases, fastCases }, null, 2);
      }

      runVerification().catch((error) => {
        document.getElementById("report").textContent = JSON.stringify({
          passed: false,
          error: error.stack || String(error)
        }, null, 2);
      });
    </script>
  </body>
</html>
