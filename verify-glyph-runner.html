<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Glyph FX Verification</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #f7f0e6;
      }

      iframe {
        width: 100%;
        height: 100%;
        display: block;
        border: 0;
      }

      pre {
        position: fixed;
        left: 8px;
        bottom: 8px;
        max-width: calc(100vw - 16px);
        max-height: 35vh;
        overflow: auto;
        margin: 0;
        padding: 8px;
        color: #2f2a25;
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(87, 70, 52, 0.16);
        font: 11px/1.35 Consolas, monospace;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <iframe id="appFrame" src="./index.html"></iframe>
    <pre id="report">Preparing...</pre>
    <script>
      "use strict";

      const params = new URLSearchParams(window.location.search);
      const mode = params.get("mode") || "electric";
      const char = params.get("char") || "A";
      const wait = (ms) => new Promise((resolve) => window.setTimeout(resolve, ms));

      async function runVerification() {
        const frame = document.getElementById("appFrame");
        await new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
        await wait(80);

        const win = frame.contentWindow;
        const doc = frame.contentDocument;
        const select = doc.getElementById("effectModeSelect");
        const editor = doc.getElementById("editor");

        select.value = mode;
        select.dispatchEvent(new Event("change", { bubbles: true }));
        editor.innerHTML = "";
        editor.focus();

        const range = doc.createRange();
        range.selectNodeContents(editor);
        range.collapse(false);
        const selection = win.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);

        doc.execCommand("insertText", false, char);
        win.triggerTypingVisualOnly(char);
        await wait(42);

        doc.getAnimations({ subtree: true }).forEach((animation) => animation.pause());
        const glyphs = [...doc.querySelectorAll(".typing-glyph")].map((glyph) => {
          const style = win.getComputedStyle(glyph);
          const rect = glyph.getBoundingClientRect();
          return {
            text: glyph.dataset.glyph,
            role: glyph.className,
            animation: style.animationName,
            opacity: style.opacity,
            color: style.color,
            transform: style.transform,
            left: Math.round(rect.left),
            top: Math.round(rect.top),
            width: Math.round(rect.width),
            height: Math.round(rect.height)
          };
        });

        document.getElementById("report").textContent = JSON.stringify({
          mode: doc.body.dataset.effect,
          editorText: editor.textContent,
          markCount: doc.querySelectorAll(".typing-mark").length,
          glyphs
        }, null, 2);
      }

      runVerification().catch((error) => {
        document.getElementById("report").textContent = error.stack || String(error);
      });
    </script>
  </body>
</html>
